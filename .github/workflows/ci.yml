name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test (warnings are errors, ASan and UBSan on)
        run: make test
      - name: Build the CLI
        run: |
          make password_analyzer
          printf 'password\nk9#Vq2$mLx8@Zp4!\n' | ./password_analyzer --stdin
